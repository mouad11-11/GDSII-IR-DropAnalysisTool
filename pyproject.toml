[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "voltdrop-gdsii"
version = "0.1.0"
description = "Static IR-drop analysis and margin signoff verification engine for physical layouts"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "mouad11-11", email = "rickbriqua@gmail.com" }
]
license = { text = "MIT" }
dependencies = [
    "gdstk>=0.9.50",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "opencv-python-headless>=4.8.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.24.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
